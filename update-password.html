<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعيين كلمة المرور | العزم العالمية للعقارات</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f2;color:#172a22;font:15px/1.8 Tahoma,Arial,sans-serif;padding:18px}.card{width:min(440px,100%);background:white;border:1px solid #e1e7e1;border-radius:18px;padding:28px;box-shadow:0 18px 55px #10251f12}h1{font-size:23px;margin:0 0 8px;color:#12372c}p{color:#66756d;font-size:13px}label{display:block;font-weight:bold;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid #d7e0d8;border-radius:8px;font:inherit}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#c9a66b;color:#17251e;font-weight:bold;font:inherit;cursor:pointer}#msg{min-height:28px;color:#9b3b2f}
</style></head>
<body><main class="card"><h1>تعيين كلمة مرور جديدة</h1><p>أدخل كلمة مرور جديدة لحساب إدارة شركة العزم.</p>
<form id="form"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit">حفظ كلمة المرور</button><p id="msg" role="status">جارٍ التحقق من رابط الاستعادة...</p></form></main>
<script src="supabase-config.js"></script>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const client=createClient(window.AL_AZM_SUPABASE.url,window.AL_AZM_SUPABASE.publishableKey);
const form=document.getElementById("form"),msg=document.getElementById("msg"),btn=document.getElementById("save");
let ready=false;
client.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY" && session){ready=true;msg.textContent="تم التحقق. أدخل كلمة المرور الجديدة.";}
});
(async()=>{
 const {data:{session},error}=await client.auth.getSession();
 if(session){ready=true;msg.textContent="تم التحقق. أدخل كلمة المرور الجديدة.";}
 else if(error){msg.textContent="تعذر التحقق من رابط الاستعادة. اطلب رابطاً جديداً.";}
 else {msg.textContent="رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطاً جديداً.";}
})();
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
 if(password.length<8){msg.textContent="كلمة المرور يجب أن تكون 8 أحرف على الأقل.";return;}
 if(password!==confirm){msg.textContent="كلمتا المرور غير متطابقتين.";return;}
 if(!ready){msg.textContent="لم يتم التحقق من رابط الاستعادة بعد. افتح أحدث رسالة بريدية.";return;}
 btn.disabled=true;msg.textContent="جارٍ حفظ كلمة المرور...";
 const {error}=await client.auth.updateUser({password});
 if(error){msg.textContent="تعذر حفظ كلمة المرور: "+error.message;btn.disabled=false;return;}
 await client.auth.signOut();
 msg.textContent="تم تحديث كلمة المرور بنجاح. سيتم تحويلك لتسجيل الدخول.";
 setTimeout(()=>location.replace("login.html"),1200);
});
</script></body></html>
